    :root {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --header: #0d5c2e;
      --header-dark: #094422;
      --primary: #128a3e;
      --primary-hover: #0f7a36;
      --primary-soft: #e8f5ec;
      --text: #1a1d21;
      --text-muted: #5c6570;
      --border: #e2e6eb;
      --ticker-bg: #0a4a24;
      --shadow: 0 4px 24px rgba(0,0,0,.06);
      --radius: 14px;
      --radius-sm: 10px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    [data-theme="dark"] {
      --bg: #0f1419;
      --surface: #1a222c;
      --header: #0a3d1f;
      --header-dark: #072e17;
      --primary: #22c55e;
      --primary-hover: #16a34a;
      --primary-soft: #14532d33;
      --text: #e8eaed;
      --text-muted: #9aa3ad;
      --border: #2a3441;
      --ticker-bg: #062816;
      --shadow: 0 4px 24px rgba(0,0,0,.35);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: "DM Sans", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- HEADER ---------- */
    .site-header {
      background: linear-gradient(160deg, var(--header) 0%, var(--header-dark) 100%);
      color: #fff;
      padding: 0.85rem 1rem 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,.15);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      max-width: 1100px;
      margin: 0 auto 0.85rem;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      min-width: 0;
    }

    .brand h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.2;
    }

    .brand span {
      font-size: 0.68rem;
      opacity: 0.85;
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .theme-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.25);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      transition: background .2s, transform .15s;
    }

    .theme-btn:hover { background: rgba(255,255,255,.22); }
    .theme-btn:active { transform: scale(0.97); }

    /* Nav grid */
    .nav-scroll {
      max-width: 1100px;
      margin: 0 auto;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }
    .nav-scroll::-webkit-scrollbar { display: none; }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.45rem;
      min-width: 640px;
    }

    @media (min-width: 900px) {
      .nav-grid { min-width: 0; }
    }

<!-- 7) CANLI DÖVİZ / ALTIN / KRİPTO ÇUBUĞU
     Trunçgil Finans API (döviz+altın, anahtarsız/ücretsiz) ve CoinGecko API
     (kripto, anahtarsız/ücretsiz) kullanılır. Mevcut kayan kur çubuğunuzdaki
     her rakamın etrafına aşağıdaki id'lerden birini verin, script otomatik
     doldurup 60 saniyede bir günceller. Örnek:
     <span id="rate-usd">USD: -- TL</span>
     <span id="rate-eur">EUR: -- TL</span>
     <span id="rate-gram-altin">GRAM ALTIN: -- TL</span>
     <span id="rate-gumus">GÜMÜŞ: -- TL</span>
     <span id="rate-btc">BTC: -- TL</span>
     <span id="rate-eth">ETH: -- TL</span>
     <span id="rate-sol">SOL: -- TL</span>
-->
<script>
document.addEventListener('DOMContentLoaded', function () {

  function fmt(n){
    return Number(n).toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function setText(id, text){
    var el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  // --- Döviz + Altın + Gümüş (Trunçgil Finans, anahtarsız) ---
  function updateFxAndGold(){
    fetch('https://finans.truncgil.com/today.json')
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d['USD']) setText('rate-usd', 'USD: ' + fmt(d['USD']['Satış']) + ' TL');
        if (d['EUR']) setText('rate-eur', 'EUR: ' + fmt(d['EUR']['Satış']) + ' TL');
        if (d['Gram Altın']) setText('rate-gram-altin', 'GRAM ALTIN: ' + fmt(d['Gram Altın']['Satış']) + ' TL');
        if (d['GUMUS'] || d['Gümüş']) {
          var gumus = d['GUMUS'] || d['Gümüş'];
          setText('rate-gumus', 'GÜMÜŞ: ' + fmt(gumus['Satış']) + ' TL');
        }
      })
      .catch(function(err){ console.warn('Kur verisi alınamadı:', err); });
  }

  // --- Kripto (CoinGecko, anahtarsız) ---
  function updateCrypto(){
    fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=try')
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.bitcoin) setText('rate-btc', 'BTC: ' + fmt(d.bitcoin.try) + ' TL');
        if (d.ethereum) setText('rate-eth', 'ETH: ' + fmt(d.ethereum.try) + ' TL');
        if (d.solana) setText('rate-sol', 'SOL: ' + fmt(d.solana.try) + ' TL');
      })
      .catch(function(err){ console.warn('Kripto verisi alınamadı:', err); });
  }

  updateFxAndGold();
  updateCrypto();
  setInterval(updateFxAndGold, 60000);  // 60 sn'de bir güncelle
  setInterval(updateCrypto, 60000);

  // ---------------------------------------------------------------------
  // ÇEREZ ONAYI mantığı + onay verilmeden önce reklam/analytics çalıştırma
  // ---------------------------------------------------------------------
  var CONSENT_KEY = 'parahesap_cookie_consent';
  var consent = document.cookie.split('; ').find(function(row){ return row.startsWith(CONSENT_KEY + '='); });

  function loadAdsAndAnalytics(){
    // AdSense reklam birimlerinizi sayfa içinde <ins class="adsbygoogle">...</ins>
    // olarak eklediyseniz burada push edilir.
    try {
      (window.adsbygoogle = window.adsbygoogle || []).push({});
    } catch(e) {}
  }

  if (consent) {
    loadAdsAndAnalytics();
  } else {
    var bar = document.createElement('div');
    bar.id = 'cookieConsentBar';
    bar.innerHTML =
      '<span>Bu sitede deneyiminizi iyileştirmek ve reklam göstermek için çerezler kullanıyoruz. ' +
      '<a href="/gizlilik-politikasi.html">Gizlilik Politikası</a> ve ' +
      '<a href="/cerez-politikasi.html">Çerez Politikası</a>\'nı inceleyebilirsiniz.</span>' +
      '<span><button id="ccReject">Reddet</button> ' +
      '<button id="ccAccept">Kabul Et</button></span>';
    document.body.appendChild(bar);

    document.getElementById('ccAccept').addEventListener('click', function(){
      document.cookie = CONSENT_KEY + '=accepted; max-age=' + (60*60*24*180) + '; path=/';
      bar.remove();
      loadAdsAndAnalytics();
    });
    document.getElementById('ccReject').addEventListener('click', function(){
      document.cookie = CONSENT_KEY + '=rejected; max-age=' + (60*60*24*180) + '; path=/';
      bar.remove();
      // Reddedilirse reklam/analytics kişiselleştirmesi yüklenmez.
    });
  }
});
</script>

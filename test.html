<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Hesaplama Aracı - Para Hesap</title>
    <style>
        :root {
            --primary: #0056b3;
            --primary-dark: #003d82;
            --bg-light: #f8f9fa;
            --text-main: #333333;
            --text-muted: #666666;
            --border: #dee2e6;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }
        header.site {
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        .brand {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            flex-direction: column;
        }
        .brand span {
            font-size: 11px;
            color: var(--text-muted);
            font-style: italic;
            font-weight: normal;
        }
        .btn-tum {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .main-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 16px;
            width: 100%;
        }
        .card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            background: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--bg-light);
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--text-main);
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            background-color: #fff;
        }
        input:focus, select:focus {
            border-color: var(--primary);
        }
        .btn-calc {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-calc:hover {
            background-color: var(--primary-dark);
        }
        .result-box {
            display: none;
            margin-top: 20px;
            padding: 16px;
            background-color: #eef6ff;
            border-left: 4px solid var(--primary);
            border-radius: 4px;
            font-size: 15px;
            line-height: 1.6;
        }
        .result-box h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
            color: var(--primary);
        }
        footer {
            text-align: center;
            padding: 30px 16px;
            color: var(--text-muted);
            font-size: 13px;
            border-top: 1px solid var(--border);
            margin-top: 40px;
            background: #ffffff;
        }
        footer a {
            color: var(--text-muted);
            text-decoration: none;
            margin: 0 6px;
        }
    </style>
</head>
<body>

<header class="site">
    <div class="nav-wrap">
        <a href="index.html" class="brand">
            parahesap.site
            <span>Anında hesapla, geleceğini planla</span>
        </a>
        <a href="tum-hesaplamalar.html" class="btn-tum">Tüm Hesaplamalar</a>
    </div>
</header>

<main class="main-container">
    <div class="card">
        <h1 id="toolHeader">Hesaplama Aracı</h1>
        
        <!-- Dinamik Form -->
        <div id="formContainer"></div>

        <button class="btn-calc" onclick="hesapla()">HESAPLA</button>

        <div id="resultBox" class="result-box">
            <h3>Sonuç:</h3>
            <div id="resultContent"></div>
        </div>
    </div>
</main>

<footer>
    <p style="color: #e83e8c; font-style: italic; font-weight: 600; margin-bottom: 10px;">"Anında hesapla, geleceğini planla"</p>
    <p>© 2026 parahesap.site - Tüm Hakları Saklıdır.</p>
    <p>
        <a href="kullanim-sartlari.html">Kullanım Şartları</a> | 
        <a href="gizlilik-politikasi.html">Gizlilik Politikası</a> | 
        <a href="hakkimizda.html">Hakkımızda</a> | 
        <a href="iletisim.html">İletişim</a> | 
        <a href="blog/index.html">Blog</a>
    </p>
</footer>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const tip = urlParams.get('tip') || 'maas';

    const header = document.getElementById('toolHeader');
    const form = document.getElementById('formContainer');
    const title = document.getElementById('pageTitle');

    if (tip === 'brutten-nete') {
        title.innerText = 'Brütten Nete Maaş Hesaplama - Para Hesap';
        header.innerText = 'Brütten Nete Maaş Hesaplama';
        form.innerHTML = `
            <div class="form-group">
                <label>Brüt Maaşınız (TL):</label>
                <input type="number" id="brutMaas" placeholder="Örn: 40000">
            </div>
            <div class="form-group">
                <label>Vergi Dilimi tahmini (%):</label>
                <select id="vergiDilimi">
                    <option value="15">%15 (Yıl Başı)</option>
                    <option value="20">%20</option>
                    <option value="27">%27</option>
                </select>
            </div>
        `;
    } else if (tip === 'zekat') {
        title.innerText = 'Zekat Hesaplama - Para Hesap';
        header.innerText = 'Zekat Hesaplama';
        form.innerHTML = `
            <div class="form-group">
                <label>Nakit ve Banka Birikimi (TL):</label>
                <input type="number" id="zekatNakit" placeholder="Örn: 100000">
            </div>
            <div class="form-group">
                <label>Altın ve Ziynet Değeri (TL):</label>
                <input type="number" id="zekatAltin" placeholder="Örn: 50000">
            </div>
            <div class="form-group">
                <label>Borçlar (TL):</label>
                <input type="number" id="zekatBorc" placeholder="Örn: 10000">
            </div>
        `;
    } else if (tip === 'vki') {
        title.innerText = 'Vücut Kitle İndeksi (VKİ) Hesaplama - Para Hesap';
        header.innerText = 'Vücut Kitle İndeksi (VKİ) Hesaplama';
        form.innerHTML = `
            <div class="form-group">
                <label>Boyunuz (cm):</label>
                <input type="number" id="vkiBoy" placeholder="Örn: 175">
            </div>
            <div class="form-group">
                <label>Kilonuz (kg):</label>
                <input type="number" id="vkiKilo" placeholder="Örn: 70">
            </div>
        `;
    } else if (tip.includes('kredisi')) {
        let krediTuru = tip === 'konut-kredisi' ? 'Konut' : (tip === 'tasit-kredisi' ? 'Taşıt' : 'İhtiyaç');
        title.innerText = `${krediTuru} Kredisi Hesaplama - Para Hesap`;
        header.innerText = `${krediTuru} Kredisi Hesaplama`;
        form.innerHTML = `
            <div class="form-group">
                <label>Kredi Tutarı (TL):</label>
                <input type="number" id="krediTutar" placeholder="Örn: 50000">
            </div>
            <div class="form-group">
                <label>Aylık Faiz Oranı (%):</label>
                <input type="number" step="0.01" id="krediFaiz" placeholder="Örn: 3.50">
            </div>
            <div class="form-group">
                <label>Vade (Ay):</label>
                <input type="number" id="krediVade" placeholder="Örn: 12">
            </div>
        `;
    } else if (tip === 'kdv') {
        title.innerText = 'KDV Hesaplama - Para Hesap';
        header.innerText = 'KDV Hesaplama';
        form.innerHTML = `
            <div class="form-group">
                <label>Tutar (TL):</label>
                <input type="number" id="kdvTutar" placeholder="Örn: 1000">
            </div>
            <div class="form-group">
                <label>KDV Oranı (%):</label>
                <select id="kdvOran">
                    <option value="20">%20</option>
                    <option value="10">%10</option>
                    <option value="1">%1</option>
                </select>
            </div>
        `;
    } else if (tip === 'kidem') {
        title.innerText = 'Kıdem Tazminatı Hesaplama - Para Hesap';
        header.innerText = 'Kıdem Tazminatı Hesaplama';
        form.innerHTML = `
            <div class="form-group">
                <label>Çalışılan Yıl Sayısı:</label>
                <input type="number" id="kidemYil" placeholder="Örn: 5">
            </div>
            <div class="form-group">
                <label>Son Son Brüt Maaş (TL):</label>
                <input type="number" id="kidemMaas" placeholder="Örn: 30000">
            </div>
        `;
    } else {
        // Maaş Zam Hesaplama (varsayılan)
        title.innerText = 'Maaş / Zam Hesaplama - Para Hesap';
        header.innerText = 'Maaş / Zam Hesaplama';
        form.innerHTML = `
            <div class="form-group">
                <label>Mevcut Maaş (TL):</label>
                <input type="number" id="maasMevcut" placeholder="Örn: 25000">
            </div>
            <div class="form-group">
                <label>Zam Oranı (%):</label>
                <input type="number" id="maasZam" placeholder="Örn: 30">
            </div>
        `;
    }

    function hesapla() {
        const resultBox = document.getElementById('resultBox');
        const resultContent = document.getElementById('resultContent');
        resultBox.style.display = 'block';

        if (tip === 'brutten-nete') {
            let brut = parseFloat(document.getElementById('brutMaas').value) || 0;
            let vergi = parseFloat(document.getElementById('vergiDilimi').value);
            let sgk = brut * 0.15; // %14 SGK + %1 İşsizlik
            let gelirVergisiMatrahi = brut - sgk;
            let gelirVergisi = (gelirVergisiMatrahi * vergi) / 100;
            let damgaVergisi = brut * 0.00759;
            let net = brut - (sgk + gelirVergisi + damgaVergisi);
            
            resultContent.innerHTML = `
                Brüt Maaş: <b>${brut.toLocaleString('tr-TR')} TL</b><br>
                Kesintiler Toplamı (SGK + Vergi): <b>${(brut - net).toLocaleString('tr-TR', {maximumFractionDigits: 2})} TL</b><br>
                <b>Tahmini Net Ele Geçen: <span style="color:#0056b3;">${net.toLocaleString('tr-TR', {maximumFractionDigits: 2})} TL</span></b>
            `;
        } else if (tip === 'zekat') {
            let nakit = parseFloat(document.getElementById('zekatNakit').value) || 0;
            let altin = parseFloat(document.getElementById('zekatAltin').value) || 0;
            let borc = parseFloat(document.getElementById('zekatBorc').value) || 0;
            let netVarlik = (nakit + altin) - borc;
            if (netVarlik <= 0) {
                resultContent.innerHTML = "Zekat mükellefi değilsiniz (Net varlığınız 0 veya daha az).";
            } else {
                let zekat = netVarlik / 40;
                resultContent.innerHTML = `Net Varlığınız: <b>${netVarlik.toLocaleString('tr-TR')} TL</b><br>Vermeniz Gereken Zekat (%2.5): <b>${zekat.toLocaleString('tr-TR')} TL</b>`;
            }
        } else if (tip === 'vki') {
            let boy = parseFloat(document.getElementById('vkiBoy').value) / 100;
            let kilo = parseFloat(document.getElementById('vkiKilo').value);
            if (!boy || !kilo) {
                resultContent.innerHTML = "Lütfen boy ve kilo değerlerini doğru giriniz.";
                return;
            }
            let vki = (kilo / (boy * boy)).toFixed(2);
            let durum = "";
            if (vki < 18.5) durum = "Zayıf";
            else if (vki < 25) durum = "Normal Kilolu";
            else if (vki < 30) durum = "Fazla Kilolu";
            else durum = "Obez";
            resultContent.innerHTML = `Vücut Kitle İndeksiniz: <b>${vki}</b><br>Durum: <b>${durum}</b>`;
        } else if (tip.includes('kredisi')) {
            let tutar = parseFloat(document.getElementById('krediTutar').value);
            let faiz = parseFloat(document.getElementById('krediFaiz').value) / 100;
            let vade = parseInt(document.getElementById('krediVade').value);
            if (!tutar || !faiz || !vade) {
                resultContent.innerHTML = "Lütfen tüm bilgileri eksiksiz giriniz.";
                return;
            }
            let taksit = (tutar * faiz * Math.pow(1 + faiz, vade)) / (Math.pow(1 + faiz, vade) - 1);
            let toplam = taksit * vade;
            resultContent.innerHTML = `Aylık Taksit: <b>${taksit.toLocaleString('tr-TR', {maximumFractionDigits: 2})} TL</b><br>Toplam Geri Ödeme: <b>${toplam.toLocaleString('tr-TR', {maximumFractionDigits: 2})} TL</b>`;
        } else if (tip === 'kdv') {
            let tutar = parseFloat(document.getElementById('kdvTutar').value) || 0;
            let oran = parseFloat(document.getElementById('kdvOran').value);
            let kdvTutar = (tutar * oran) / 100;
            let toplam = tutar + kdvTutar;
            resultContent.innerHTML = `KDV Tutarı: <b>${kdvTutar.toLocaleString('tr-TR', {maximumFractionDigits: 2})} TL</b><br>KDV Dahil Toplam: <b>${toplam.toLocaleString('tr-TR', {maximumFractionDigits: 2})} TL</b>`;
        } else if (tip === 'kidem') {
            let yil = parseFloat(document.getElementById('kidemYil').value) || 0;
            let maas = parseFloat(document.getElementById('kidemMaas').value) || 0;
            let brutKidem = yil * maas;
            let damga = brutKidem * 0.00759;
            let netKidem = brutKidem - damga;
            resultContent.innerHTML = `Brüt Kıdem Tazminatı: <b>${brutKidem.toLocaleString('tr-TR')} TL</b><br>Damga Vergisi Kesintisi: <b>${damga.toFixed(2)} TL</b><br><b>Net Alınacak Kıdem: ${netKidem.toLocaleString('tr-TR', {maximumFractionDigits: 2})} TL</b>`;
        } else {
            let maas = parseFloat(document.getElementById('maasMevcut').value) || 0;
            let zam = parseFloat(document.getElementById('maasZam').value) || 0;
            let zamMiktari = (maas * zam) / 100;
            let yeniMaas = maas + zamMiktari;
            resultContent.innerHTML = `Zam Miktarı: <b>${zamMiktari.toLocaleString('tr-TR')} TL</b><br>Yeni Zamlı Maaş: <b>${yeniMaas.toLocaleString('tr-TR')} TL</b>`;
        }
    }
</script>

</body>
</html>

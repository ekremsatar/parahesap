<html lang="tr">

  <meta

  <style>
    :root {
      --primary: #176326;
      --primary-dark: #10481b;
      --primary-light: #2f853d;
      --gold: #d7b84b;

      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #20242a;
      --muted: #68717d;
      --border: #dfe5e9;
      --input-border: #1e1e1e;

      --shadow: 0 6px 18px rgba(0, 0, 0, 0.07);
    }

    body.dark-mode {
      --bg: #121714;
      --card: #1d251f;
      --text: #eff5ef;
      --muted: #afb9b0;
      --border: #334036;
      --input-border: #bdc8bd;
      --shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.25s ease, color 0.25s ease;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* HEADER */
    .site-header {
      background: var(--primary);
      color: #fff;
      padding: 22px 20px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .logo {
      font-size: 31px;
      font-weight: 800;
      letter-spacing: 0.7px;
      line-height: 1;
    }

    .tagline {
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 1.2px;
      margin-top: 7px;
      text-transform: uppercase;
    }

    .theme-button {
      background: transparent;
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 25px;
      padding: 9px 15px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.2s ease;
    }

    .theme-button:hover {
      background: rgba(255, 255, 255, 0.13);
    }

    /* MENU */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .menu-item {
      min-height: 43px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 9px 10px;
      text-align: center;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      border: 2px solid #3d9d4b;
      border-radius: 7px;
      transition: all 0.2s ease;
    }

    .menu-item:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }

    .menu-item.active {
      background: #fff;
      color: var(--primary);
      border-color: #fff;
    }

    /* TICKER */

      background: #10391a;
      color: var(--gold);
      overflow: hidden;
      border-bottom: 1px solid rgba(0, 0, 0, 0.25);

      margin: 0 auto;

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Hesap - Finansal Hesaplama ve Canlı Kurlar</title>

    <!-- Google Analytics (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GKXWCDPHMF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-GKXWCDPHMF');
    </script>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2881789176542881" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        header h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .ticker-card, .calculator-card {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #e1e8ed;
            border-radius: 6px;
            background: #fafbfc;
        }
        .rates-grid {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        .rate-box {
            flex: 1;
            background: #fff;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: center;
        }
        .rate-box span {
            display: block;
            font-weight: bold;
            color: #27ae60;
            margin-top: 5px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .result-area {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #27ae60;
        }
        .ad-container {
            margin: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Para Hesap Portalı</h1>
            <p>Finansal hesaplamalar ve canlı piyasa verileri</p>
        </header>

        <!-- Canlı Kur Akışı Alanı -->
        <section class="ticker-card">
            <h3>Canlı Döviz Kurları</h3>
            <div class="rates-grid">
                <div class="rate-box">
                    USD / TRY
                    <span id="usdRate">Yükleniyor...</span>
                </div>
                <div class="rate-box">
                    EUR / TRY
                    <span id="eurRate">Yükleniyor...</span>
                </div>
            </div>
        </section>

        <!-- AdSense Reklam Alanı Örneği -->
        <div class="ad-container">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-2881789176542881"
                 data-ad-slot="ÖRNEK_SLOT_ID"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>

        <!-- Hesaplama Aracı -->
        <main>
            <section class="calculator-card">
                <h2>Tutar Hesaplama</h2>
                <div class="input-group">
                    <label for="amount">Tutar Girin:</label>
                    <input type="number" id="amount" placeholder="0.00">
                </div>
                <button id="calculateBtn">Hesapla</button>
                <div id="result" class="result-area"></div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 parahesap.site - Tüm hakları saklıdır.</p>
        </footer>
    </div>

    <script>
        // Canlı Kur Çekme Fonksiyonu
        async function fetchLiveRates() {
            try {
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await response.json();
                
                if (data && data.rates) {
                    const tryRate = data.rates.TRY; 
                    const eurToUsd = data.rates.EUR;
                    const eurTryRate = tryRate / eurToUsd; 

                    document.getElementById('usdRate').innerText = tryRate.toFixed(4) + ' ₺';
                    document.getElementById('eurRate').innerText = eurTryRate.toFixed(4) + ' ₺';
                }
            } catch (error) {
                console.error('Kur bilgisi alınamadı:', error);
                document.getElementById('usdRate').innerText = 'Hata';
                document.getElementById('eurRate').innerText = 'Hata';
            }
        }

        fetchLiveRates();
        setInterval(fetchLiveRates, 60000);

        document.getElementById('calculateBtn').addEventListener('click', function() {
            const amount = parseFloat(document.getElementById('amount').value) || 0;
            const resultDiv = document.getElementById('result');
            resultDiv.innerText = `Hesaplanan Tutar: ${(amount * 1.20).toFixed(2)} ₺`;
        });
    </script>
</body>
</html>
